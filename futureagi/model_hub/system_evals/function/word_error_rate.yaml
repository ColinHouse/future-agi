eval_id: 163
name: word_error_rate
description: Computes Word Error Rate (WER) for ASR/STT evaluation. WER measures the edit distance at the word level between
  reference and hypothesis transcriptions. Returns 1-WER as score (higher=better).
criteria: Measures speech recognition accuracy by counting word-level insertions, deletions, and substitutions.
eval_tags:
- NLP Metrics
- Audio
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys:
  - reference
  - hypothesis
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  function_params_schema:
    normalize:
      type: string
      default: "none"
    tokenize:
      type: string
      default: "word"
  config_params_desc:
    reference: Ground truth transcription
    hypothesis: ASR/STT output transcription
    normalize: "none (default) scores the text as given; basic maps full-width characters to ASCII and turns punctuation into spaces first"
    tokenize: "word (default) splits on spaces; auto also splits Chinese, Japanese and Korean into single characters; char scores characters, ignoring spaces"
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        import re

        normalize = str(kwargs.get("normalize") or "none").strip().lower()
        tokenize = str(kwargs.get("tokenize") or "word").strip().lower()
        if normalize not in ("none", "basic"):
            return {"score": 0.0, "reason": "normalize must be none or basic"}
        if tokenize not in ("word", "auto", "char"):
            return {"score": 0.0, "reason": "tokenize must be word, auto or char"}

        def tokens_of(value):
            text = str(value).strip().lower()
            if normalize == "basic":
                # Full-width ASCII to ASCII, then punctuation to spaces (as Whisper's
                # basic normalizer does). Word characters such as 々 and ー stay.
                text = re.sub("[\uff01-\uff5e]", lambda m: chr(ord(m.group()) - 0xFEE0), text)
                text = re.sub(r"[!-/:-@\[-`{-~\u2010-\u2027\u2030-\u205e\u3001-\u3003\u3008-\u3011\u3014-\u301f\u3030\u303d\u30fb\uff61-\uff65]", " ", text)
            if tokenize == "char":
                return [c for c in text if not c.isspace()]
            if tokenize == "auto":
                # Chinese, Japanese and Korean are written without spaces between
                # words, so score them per character.
                text = re.sub(r"([\u3040-\u30ff\u31f0-\u31ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uac00-\ud7af])", r" \1 ", text)
            return text.split()

        reference = kwargs.get("reference", expected or "")
        hypothesis = kwargs.get("hypothesis", output or "")
        ref_words = tokens_of(reference)
        hyp_words = tokens_of(hypothesis)
        if not ref_words and not hyp_words:
            return {"score": 1.0, "reason": "WER: 0.0% (both empty)"}
        if not ref_words:
            return {"score": 0.0, "reason": f"WER: 100%+ ({len(hyp_words)} insertions)"}
        n, m = len(ref_words), len(hyp_words)
        dp = list(range(m + 1))
        for i in range(1, n + 1):
            prev = dp[:]
            dp[0] = i
            for j in range(1, m + 1):
                cost = 0 if ref_words[i-1] == hyp_words[j-1] else 1
                dp[j] = min(dp[j-1]+1, prev[j]+1, prev[j-1]+cost)
        distance = dp[m]
        wer = distance / len(ref_words)
        score = max(0.0, 1.0 - wer)
        return {"score": float(score), "reason": f"WER: {wer*100:.1f}% ({distance} edits / {len(ref_words)} words)"}
