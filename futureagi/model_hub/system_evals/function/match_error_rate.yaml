eval_id: 189
name: match_error_rate
description: "Computes Match Error Rate (MER) for speech recognition. MER = edits / (hits + edits). Returns 1-MER as score."
eval_tags:
- NLP Metrics
- Audio
visible_ui: true
permissions: {allow_edit: false, allow_copy: true}
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys: [reference, hypothesis]
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  function_params_schema:
    normalize: {type: string, default: "none"}
    tokenize: {type: string, default: "word"}
  config_params_desc: {reference: Ground truth transcription, hypothesis: ASR output, normalize: "none (default) scores the text as given; basic maps full-width characters to ASCII and turns punctuation into spaces first", tokenize: "word (default) splits on spaces; auto also splits Chinese, Japanese and Korean into single characters; char scores characters, ignoring spaces"}
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        def align_counts(ref, hyp):
            n, m = len(ref), len(hyp)
            dp = [[0] * (m + 1) for _ in range(n + 1)]
            for i in range(n + 1): dp[i][0] = i
            for j in range(m + 1): dp[0][j] = j
            for i in range(1, n + 1):
                for j in range(1, m + 1):
                    cost = 0 if ref[i - 1] == hyp[j - 1] else 1
                    dp[i][j] = min(dp[i - 1][j - 1] + cost, dp[i - 1][j] + 1, dp[i][j - 1] + 1)
            hits = sub = dele = ins = 0
            i, j = n, m
            while i > 0 or j > 0:
                if i > 0 and j > 0 and ref[i - 1] == hyp[j - 1] and dp[i][j] == dp[i - 1][j - 1]:
                    hits += 1; i -= 1; j -= 1
                elif i > 0 and j > 0 and dp[i][j] == dp[i - 1][j - 1] + 1:
                    sub += 1; i -= 1; j -= 1
                elif i > 0 and dp[i][j] == dp[i - 1][j] + 1:
                    dele += 1; i -= 1
                else:
                    ins += 1; j -= 1
            return hits, sub, dele, ins

        import re

        normalize = str(kwargs.get("normalize") or "none").strip().lower()
        tokenize = str(kwargs.get("tokenize") or "word").strip().lower()
        if normalize not in ("none", "basic"):
            return {"score": 0.0, "reason": "normalize must be none or basic"}
        if tokenize not in ("word", "auto", "char"):
            return {"score": 0.0, "reason": "tokenize must be word, auto or char"}

        def tokens_of(value):
            text = str(value).strip().lower()
            if normalize == "basic":
                # Full-width ASCII to ASCII, then punctuation to spaces (as Whisper's
                # basic normalizer does). Word characters such as 々 and ー stay.
                text = re.sub("[\uff01-\uff5e]", lambda m: chr(ord(m.group()) - 0xFEE0), text)
                text = re.sub(r"[!-/:-@\[-`{-~\u2010-\u2027\u2030-\u205e\u3001-\u3003\u3008-\u3011\u3014-\u301f\u3030\u303d\u30fb\uff61-\uff65]", " ", text)
            if tokenize == "char":
                return [c for c in text if not c.isspace()]
            if tokenize == "auto":
                # Chinese, Japanese and Korean are written without spaces between
                # words, so score them per character.
                text = re.sub(r"([\u3040-\u30ff\u31f0-\u31ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uac00-\ud7af])", r" \1 ", text)
            return text.split()

        ref = tokens_of(kwargs.get("reference", expected or ""))
        hyp = tokens_of(kwargs.get("hypothesis", output or ""))
        if not ref and not hyp:
            return {"score": 1.0, "reason": "MER: 0% (both empty)"}
        if not ref:
            return {"score": 0.0, "reason": "Empty reference"}
        hits, S, D, I = align_counts(ref, hyp)
        ops = S + D + I
        mer = ops / (hits + ops) if (hits + ops) > 0 else 1.0
        return {"score": float(max(0.0, 1 - mer)), "reason": f"MER: {mer * 100:.1f}% (H={hits}, S={S}, D={D}, I={I})"}
